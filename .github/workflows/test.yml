name: Skill quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix scripts
      - run: npm test
      - run: node scripts/audit.mjs examples/sample-dna.json --strict
      - run: node scripts/export-tokens.mjs examples/sample-dna.json --format dtcg --out /tmp/tokens.json
      - run: node scripts/export-tokens.mjs examples/sample-dna.json --format css --out /tmp/tokens.css
      - run: node scripts/report.mjs examples/sample-dna.json --out /tmp/design-report.html
